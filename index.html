<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>
    <form id="form">
      <input id="input" type="text" placeholder="What do you need to do?" autocomplete="off" maxlength="80">
      <button type="submit">Add</button>
    </form>
    <div class="filters" id="filters">
      <button data-filter="all" class="on">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>
    <ul id="list"></ul>
    <p id="empty" hidden>Nothing here. Add your first task!</p>
    <div class="footer">
      <span id="count">0 tasks left</span>
      <button id="clear" type="button">Clear done</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
